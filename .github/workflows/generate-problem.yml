name: Generate problem

on:
  schedule:
    # 매주 월요일 02:00 KST (일요일 17:00 UTC)
    - cron: "0 17 * * 0"
  workflow_dispatch:
    inputs:
      count:
        description: "병렬 슬롯 수 (슬롯마다 문제 최대 1개, 최대 8). 예약 실행은 3"
        type: number
        default: 1
      topic:
        description: "주제 (비우면 무작위)"
        type: string
        default: ""
      difficulty:
        description: "난이도 (비우면 무작위)"
        type: choice
        options: ["", "easy", "medium", "hard"]
        default: ""
      max_attempts:
        description: "슬롯당 최대 시도 횟수"
        type: number
        default: 4
      domain:
        description: "문제 소재 (scripts/lib/domains.mjs: backend, containers, aws, database, networking, cicd). 비우면 시도의 60% 에 무작위 소재, none 이면 소재 없음"
        type: string
        default: ""
      archetype:
        description: "hard 아키타입 키 (scripts/lib/archetypes.mjs). 지정하면 모든 슬롯이 그 아키타입으로 hard 를 생성"
        type: string
        default: ""
      model:
        description: "Ollama 모델 태그. 러너 메모리 15GB 안에 들어가야 한다(14b q4 = 약 9GB)"
        type: string
        default: "qwen3:14b"
      runner:
        description: "러너. ARM 이 x64 보다 생성이 약 30% 빠르다(3.5 vs 2.7 tok/s, 2026-11-01 측정). 둘 다 공개 저장소에서 무료"
        type: choice
        options: ["ubuntu-24.04-arm", "ubuntu-latest"]
        default: "ubuntu-24.04-arm"
      rejudge:
        description: "재판정할 문제 id (쉼표 구분, all = 생성된 문제 전부). 지정하면 생성 대신 재판정만 한다"
        type: string
        default: ""
      audit:
        description: "지문 검수만 할 문제 id (쉼표 구분). 지정하면 생성·커밋 없이 검수 보고서만 잡 요약에 남긴다"
        type: string
        default: ""

permissions:
  contents: write
  pull-requests: write

# 같은 브랜치의 실행만 줄 세운다. 다른 브랜치에서 띄운 실험 실행은 main 의 실행과 겹쳐도 된다.
concurrency:
  group: generate-problem-${{ github.ref }}
  cancel-in-progress: false

env:
  OLLAMA_MODEL: ${{ inputs.model || 'qwen3:14b' }}
  OLLAMA_THINK: "false"
  COUNT: ${{ inputs.count || 3 }}
  TOPIC: ${{ inputs.topic }}
  DIFFICULTY: ${{ inputs.difficulty }}
  REJUDGE: ${{ inputs.rejudge }}
  MAX_ATTEMPTS: ${{ inputs.max_attempts || 4 }}
  ARCHETYPE: ${{ inputs.archetype }}
  DOMAIN: ${{ inputs.domain }}
  AUDIT: ${{ inputs.audit }}
  # 새 시도·단계 호출은 이 시간 안에서만 시작한다. 한 호출은 최대 OLLAMA_CALL_TIMEOUT_MS(기본 20분)이므로
  # 60 + 20 분 뒤에는 생성이 끝나고, 그때까지 만든 문제는 timeout-minutes 안에서 검증·업로드된다.
  GENERATION_BUDGET_MINUTES: "60"

jobs:
  # 슬롯 계획: 병렬 잡 하나당 문제 최대 1개. hard 슬롯은 서로 다른 아키타입으로 시작하고 형제 슬롯의
  # 아키타입은 피한다(병렬 잡은 서로의 거부 후보를 볼 수 없으므로).
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
      - id: plan
        run: echo "matrix=$(node scripts/plan-slots.mjs)" >> "$GITHUB_OUTPUT"

  generate:
    needs: plan
    runs-on: ${{ inputs.runner || 'ubuntu-24.04-arm' }}
    timeout-minutes: 90
    # 슬롯 하나가 실패해도(문제 0개) 나머지 슬롯과 수집은 계속된다. 전체 결과는 collect 가 정한다.
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.plan.outputs.matrix) }}
    name: "${{ matrix.mode }} ${{ matrix.slot }}${{ matrix.archetype && format(' ({0})', matrix.archetype) || '' }}"
    env:
      SLOT: ${{ matrix.slot }}
      MODE: ${{ matrix.mode }}
      # 슬롯 계획이 정한 값이 입력보다 우선한다 (주제 교체, 아키타입 배정).
      TOPIC: ${{ matrix.topic }}
      DIFFICULTY: ${{ matrix.difficulty }}
      ARCHETYPE_FIRST: ${{ matrix.archetype }}
      ARCHETYPE_EXCLUDE: ${{ matrix.exclude }}
      COUNT: 1
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      - name: Ollama 설치 및 모델 준비
        env:
          OLLAMA_VERSION: v0.32.6
          OLLAMA_SHA256_AMD64: dec2fa50d24e6868ca3c4c977d69d059399372105f951a9acc320a5a79aadcfc
          OLLAMA_SHA256_ARM64: 18fecc359b9366a8462e664d9eccf11e8405e5101fe968ee141689106eea0bd2
        run: |
          case "$(uname -m)" in
            x86_64) arch=amd64; sha="$OLLAMA_SHA256_AMD64" ;;
            aarch64) arch=arm64; sha="$OLLAMA_SHA256_ARM64" ;;
            *) echo "unsupported arch $(uname -m)"; exit 1 ;;
          esac
          echo "runner: $(uname -m), $(nproc) cpu, $(free -g | awk '/Mem/{print $2}') GB"
          command -v zstd >/dev/null || (sudo apt-get update -y && sudo apt-get install -y zstd)
          curl -fsSL -o ollama.tar.zst \
            "https://github.com/ollama/ollama/releases/download/${OLLAMA_VERSION}/ollama-linux-${arch}.tar.zst"
          echo "${sha}  ollama.tar.zst" | sha256sum -c -
          zstd -d ollama.tar.zst -o ollama.tar
          sudo tar -xf ollama.tar -C /usr/local
          rm -f ollama.tar.zst ollama.tar

          ollama serve &
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:11434/api/version > /dev/null && break
            sleep 1
          done
          # 레지스트리가 가끔 503 을 돌려준다(2026-11-01 실행에서 슬롯 하나가 여기서 죽었다). 잠시 쉬고 다시 받는다.
          for i in 1 2 3 4; do
            ollama pull "$OLLAMA_MODEL" && break
            [ "$i" = 4 ] && exit 1
            echo "pull 실패, ${i}번째 재시도 전 30초 대기"; sleep 30
          done

      - name: 문제 생성
        if: env.MODE == 'generate'
        run: node scripts/generate-problem.mjs

      - name: 난이도 재판정
        if: env.MODE == 'rejudge'
        run: |
          if [ "$REJUDGE" = "all" ]; then
            node scripts/judge-problems.mjs
          else
            node scripts/judge-problems.mjs $(echo "$REJUDGE" | tr ',' ' ')
          fi

      - name: 전체 문제 검증
        run: npm test

      # 검수: 게이트를 전부 통과한 문제라도 지문이 풀이의 규칙(방향, 경계, 동점 처리 등)을 다 말하지는
      # 않는다. 모델이 지문과 풀이·테스트를 대조해 빠진 규칙을 적고, 보고서는 PR 본문과 잡 요약에 들어간다.
      - name: 변경된 문제 목록
        id: changed
        run: |
          if [ "$MODE" = "audit" ]; then
            ids=$(echo "$AUDIT" | tr ',' ' ')
          else
            ids=$(git status --porcelain problems | awk '{print $2}' | sed 's#problems/##; s#\.json##' | tr '\n' ' ')
          fi
          echo "ids=$ids" >> "$GITHUB_OUTPUT"
          echo "변경된 문제: ${ids:-없음}"

      - name: 지문 검수
        if: steps.changed.outputs.ids != ''
        env:
          AUDIT_OUT: ${{ runner.temp }}/report.md
        run: |
          node scripts/audit-problems.mjs ${{ steps.changed.outputs.ids }}
          { echo "## 지문 검수 (슬롯 $SLOT)"; echo; cat "$AUDIT_OUT"; } >> "$GITHUB_STEP_SUMMARY"

      - name: 후보 업로드 준비
        if: env.MODE != 'audit' && steps.changed.outputs.ids != ''
        run: |
          mkdir -p candidate/problems
          for id in ${{ steps.changed.outputs.ids }}; do cp "problems/$id.json" candidate/problems/; done
          cp "${{ runner.temp }}/report.md" candidate/report.md

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: env.MODE != 'audit' && steps.changed.outputs.ids != ''
        with:
          name: candidate-${{ matrix.slot }}
          path: candidate
          if-no-files-found: error

  # 수집: 슬롯이 올린 후보를 모아 중복을 거르고 PR 하나를 연다. Ollama 는 필요 없다.
  # PR 의 base 는 실행한 브랜치다(예약 실행은 main). 실험 브랜치의 결과가 main 으로 향하지 않게 한다.
  collect:
    needs: [plan, generate]
    if: always() && needs.plan.result == 'success' && !inputs.audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          pattern: candidate-*
          path: candidates

      - name: 후보 수집
        env:
          PR_BODY_OUT: ${{ runner.temp }}/pr-body.md
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: node scripts/collect-candidates.mjs candidates

      - name: 전체 문제 검증
        run: npm test

      - name: PR 생성
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          branch="problems/run-${{ github.run_id }}"
          base="$GITHUB_REF_NAME"
          git checkout -b "$branch"
          git add problems
          if git diff --cached --quiet; then
            echo "변경 없음"
            exit 1
          fi
          added=$(git diff --cached --name-only --diff-filter=A | sed 's#problems/##; s#\.json##' | tr '\n' ' ')
          if [ -n "$added" ]; then
            title="feat(problems): 문제 추가 ${added}"
          else
            title="chore(problems): 난이도 재판정"
          fi
          git commit -m "$title"
          git push origin "$branch"
          if ! gh pr create --base "$base" --head "$branch" --title "$title" --body-file "$RUNNER_TEMP/pr-body.md"; then
            echo "::error::PR 생성 실패. 브랜치 $branch 는 push 되어 있다. 'GitHub Actions is not permitted to create or approve pull requests' 라면 저장소 Settings > Actions > General > Workflow permissions 에서 'Allow GitHub Actions to create and approve pull requests' 를 켠다."
            echo "수동 PR: ${{ github.server_url }}/${{ github.repository }}/compare/$base...$branch"
            exit 1
          fi
          cat "$RUNNER_TEMP/pr-body.md" >> "$GITHUB_STEP_SUMMARY"
